name: Aura Bank Financial Analytics CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Java 11 (Required for PySpark & Spark SQL)
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run PyTest Automated Unit Tests
      run: |
        pytest tests/

    - name: Test Synthetic Ingestion Generator
      run: |
        python scripts/integrate_kaggle_synthetic.py --limit 1000

    - name: Test PySpark Bronze-to-Silver ETL (Quality Gates)
      run: |
        python spark_jobs/batch/bronze_to_silver.py

    - name: Test PySpark Silver-to-Gold ETL (ML Predictive Risk Model)
      run: |
        python spark_jobs/batch/silver_to_gold.py

    - name: Verify Final Data & ML Outputs
      run: |
        python scripts/verify_data_integrity.py
